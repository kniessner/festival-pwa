<!--
    Simple tent silhouette for the fly-to menu row. Uses `currentColor`
    so it inherits the popover text color. Same 24×24 grid + stroke-
    width 2 as the other POI icons so the four rows visually match.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
     stroke="currentColor" stroke-width="2" stroke-linejoin="round">
    <path d="M12 4 L3 19 h18 z"/>
    <path d="M12 4 L12 19"/>
</svg>
