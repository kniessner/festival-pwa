<!--
    "WC" mark in a rounded box — universal toilet pictogram. Rendered
    monochrome (currentColor) so it takes the popover's text color.
    We use text rather than a stylized figure because the character
    string reads regardless of iconographic literacy.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
     stroke="currentColor" stroke-width="2" stroke-linejoin="round">
    <rect x="3" y="4" width="18" height="16" rx="2"/>
    <text x="12" y="16" font-family="sans-serif" font-size="9"
          font-weight="700" text-anchor="middle" fill="currentColor"
          stroke="none">WC</text>
</svg>
