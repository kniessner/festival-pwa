<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 72" width="56" height="72">
  <!--
    Bespoke "where is my tent" marker for the Bucht der Träumer map.
    Palette-native: cream drop-pin (#f2e9dc, same tone as label text)
    with an ink stroke (#1c0716), red tent silhouette (#c22a4c, matches
    the stages overlay hue for a subtle festival tie-in), and a center
    tent pole in ink. Drop-shadow is applied via CSS on .tent-marker so
    it composes with the marker's zoom-scaling — no inline filter here.
  -->
  <path d="M28 0C13 0 0 12 0 27c0 19 28 45 28 45s28-26 28-45C56 12 43 0 28 0z"
        fill="#f2e9dc" stroke="#1c0716" stroke-width="1.8"/>
  <g transform="translate(28,26)">
    <path d="M-16 12 L0 -14 L16 12 Z"
          fill="#c22a4c" stroke="#1c0716" stroke-width="1.4"
          stroke-linejoin="round"/>
    <line x1="0" y1="-14" x2="0" y2="12"
          stroke="#1c0716" stroke-width="1.4"/>
  </g>
</svg>
