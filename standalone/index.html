<!doctype html>
<html lang="de">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1, shrink-to-fit=no, maximum-scale=1.0, user-scalable=0" />
  <meta name="theme-color" content="#080943" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Bucht der Träumer – Festival Guide</title>
  <link rel="manifest" href="manifest.json?v=1785952891" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link
    href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=Space+Grotesk:wght@500;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="css/tokens.css?v=1785952891" />
  <link rel="stylesheet" href="css/base.css?v=1785952891" />
  <link rel="stylesheet" href="css/components.css?v=1785952891" />
  <link rel="stylesheet" href="css/views.css?v=1785952891" />
</head>

<body>

  <main>
    <div class="search-bar" id="searchBar">
      <img src="images/logo.png" alt="Bucht der Träumer" class="app-logo">
      <button type="button" class="lang-switcher" id="langSwitcher" data-action="toggle-lang"></button>
      <button type="button" class="search-toggle" id="searchToggle" data-action="toggle-search-bar" aria-label="Search">
        <img src="images/search.svg" alt="" width="20" height="20">
      </button>
      <div class="search-input-wrap" id="searchInputWrap">
        <span class="search-input-icon"><img src="images/search.svg" alt="" width="18" height="18"></span>
        <input type="search" id="searchInput" placeholder="Suchen..." autocomplete="off">
        <button type="button" class="search-input-close" data-action="close-search-bar" aria-label="Close search">
          <img src="images/close.svg" alt="" width="14" height="14">
        </button>
      </div>
    </div>

    <div class="search-modal" id="searchModal">
      <div class="search-modal-backdrop" data-action="close-search"></div>
      <div class="search-modal-panel">
        <div class="search-modal-header">
          <span>Suchergebnisse</span>
          <button type="button" class="search-modal-close" data-action="close-search">✕</button>
        </div>
        <div class="search-results" id="searchResults"></div>
      </div>
    </div>

    <div class="notifications-modal" id="notificationsModal">
      <div class="notifications-modal-backdrop" data-action="close-notifications"></div>
      <div class="notifications-modal-panel">
        <div class="notifications-modal-header">
          <span id="notificationsTitle">Neuigkeiten</span>
        </div>
        <div class="notifications-list" id="notificationsList"></div>
        <button type="button" class="notifications-done" data-action="close-notifications" id="notificationsDoneBtn">Fertig</button>
      </div>
    </div>

    <!-- Location-permission onboarding overlay. Pre-rendered here (matches
         #notificationsModal / #searchModal pattern); js/onboarding.js
         localises the strings and toggles the .open class on first launch. -->
    <div class="onboarding-modal" id="onboardingModal">
      <div class="onboarding-modal-panel">
        <h2 class="onboarding-headline" id="onboardingHeadline"></h2>
        <p class="onboarding-intro" id="onboardingIntro"></p>
        <div class="onboarding-feature">
          <div class="onboarding-feature-badge">1</div>
          <p id="onboardingFeatureTimetable"></p>
        </div>
        <p class="onboarding-disclaimer" id="onboardingDisclaimer"></p>
        <div class="onboarding-privacy">
          <h3 id="onboardingPrivacyTitle"></h3>
          <p id="onboardingPrivacyBody"></p>
        </div>
        <div class="onboarding-actions">
          <button type="button" class="onboarding-btn onboarding-btn-secondary" data-action="onboarding-not-now" id="onboardingBtnNotNow"></button>
          <button type="button" class="onboarding-btn onboarding-btn-primary" data-action="onboarding-allow" id="onboardingBtnAllow"></button>
        </div>
      </div>
    </div>

    <!-- Push-notification onboarding overlay — shown right after the
         location one closes (either button), never bundled into the same
         tap: Notification.requestPermission() needs its OWN user gesture,
         same iOS-PWA rule as the location prompt's getCurrentPosition. -->
    <div class="onboarding-modal" id="pushOnboardingModal">
      <div class="onboarding-modal-panel">
        <h2 class="onboarding-headline" id="pushOnboardingHeadline"></h2>
        <p class="onboarding-intro" id="pushOnboardingIntro"></p>
        <div class="onboarding-feature">
          <div class="onboarding-feature-badge">🔔</div>
          <p id="pushOnboardingFeature"></p>
        </div>
        <div class="onboarding-actions">
          <button type="button" class="onboarding-btn onboarding-btn-secondary" data-action="push-onboarding-not-now" id="pushOnboardingBtnNotNow"></button>
          <button type="button" class="onboarding-btn onboarding-btn-primary" data-action="push-onboarding-allow" id="pushOnboardingBtnAllow"></button>
        </div>
      </div>
    </div>

    <div class="app-header" id="app-header">
      <div class="last-updated" id="lastUpdated"></div>
      <div class="app-header-row">
        <h1 id="pageTitle">Bucht der Träumer</h1>
        <button type="button" class="header-filter-btn" id="headerFilterBtn" data-action="toggle-filter">
          <img src="images/filter.svg" alt="" width="18" height="18">
          <span id="headerFilterLabel"></span>
        </button>
      </div>
    </div>

    <div class="content" id="content">
      <div class="loading">Laden...⏳</div>
    </div>

    <!-- Drop-up menu — replaces the old fixed bottom-nav icon row.
         Follows the same fixed-backdrop + .open-toggled panel convention
         as #searchModal / #notificationsModal / #onboardingModal. See
         docs/superpowers/specs/2026-08-03-dropup-nav-menu-design.md. -->
    <button type="button" class="menu-trigger" id="menuTrigger" data-action="open-menu">
      <img src="images/menu.svg" alt="" class="menu-trigger-icon" width="24" height="24">
      <span class="menu-trigger-label" id="menuTriggerLabel"></span>
    </button>

    <div class="menu-modal" id="menuModal">
      <div class="menu-modal-backdrop" data-action="close-menu"></div>
      <div class="menu-modal-panel">
        <div class="menu-modal-header">
          <span id="menuModalTitle"></span>
        </div>
        <button type="button" class="menu-modal-refresh" id="menuRefreshBtn" data-action="refresh-data" aria-label="Refresh">↻</button>
        <button type="button" class="menu-modal-close" data-action="close-menu" aria-label="Close">✕</button>
        <nav class="menu-nav-list" id="menuNavList"><!-- JS fills --></nav>
        <div class="menu-news-preview" id="menuNewsPreview" data-action="goto-news">
          <div id="menuNewsPreviewContent"><!-- JS fills --></div>
        </div>
      </div>
    </div>

  </main>

  <script type="module" src="js/app.js?v=1785952891"></script>
</body>

</html>
