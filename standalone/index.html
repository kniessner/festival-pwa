<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#080943">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Bucht der Träumer* – Festival Guide (Standalone) – Festival Guide</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link
        href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=Space+Grotesk:wght@500;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #080943;
            --bg-card: rgba(15, 18, 130, 0.35);
            --bg-card-hover: rgba(15, 18, 130, 0.55);
            --accent-pink: #b0327a;
            --accent-purple: #762c8c;
            --accent-orange: #ff6f21;
            --accent-blue: #0303d5;
            --text: #f3efdf;
            --text-muted: rgba(243, 239, 223, 0.6);
            --border: rgba(176, 50, 122, 0.3);
            --radius: 12px;
            --font-body: 'Lato', sans-serif;
            --font-head: 'Space Grotesk', sans-serif;
        }


        @font-face {
            font-family: Lato;
            font-style: normal;
            font-weight: 400;
            font-display: fallback;
            src: url('https://bucht-der-traeumer.de/wp-content/uploads/fonts/Lato-Regular.ttf') format('truetype');
        }

        @font-face {
            font-family: Lato;
            font-style: normal;
            font-weight: 700;
            font-display: fallback;
            src: url('https://bucht-der-traeumer.de/wp-content/uploads/fonts/Lato-Bold.ttf') format('truetype');
        }

        @font-face {
            font-family: "Megan Display";
            font-style: normal;
            font-weight: 400;
            font-display: fallback;
            src: url('https://bucht-der-traeumer.de/wp-content/uploads/fonts/Megan-Display.otf') format('opentype');
        }

        @font-face {
            font-family: 'eplus-icon';
            src: url('https://bucht-der-traeumer.de/wp-content/plugins/editorplus/extensions/icon-inserter/fonts/eplus-icon.eot?xs1351');
            src: url('https://bucht-der-traeumer.de/wp-content/plugins/editorplus/extensions/icon-inserter/fonts/eplus-icon.eot?xs1351#iefix') format('embedded-opentype'),
                url('https://bucht-der-traeumer.de/wp-content/plugins/editorplus/extensions/icon-inserter/fonts/eplus-icon.ttf?xs1351') format('truetype'),
                url('https://bucht-der-traeumer.de/wp-content/plugins/editorplus/extensions/icon-inserter/fonts/eplus-icon.woff?xs1351') format('woff'),
                url('https://bucht-der-traeumer.de/wp-content/plugins/editorplus/extensions/icon-inserter/fonts/eplus-icon.svg?xs1351#eplus-icon') format('svg');
            font-weight: normal;
            font-style: normal;
            font-display: block;
        }

        /*# sourceURL=editor_plus-plugin-frontend-style-inline-css */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-body);
            background: var(--bg) url('images/bg.jpg') center top / cover fixed no-repeat;
            color: var(--text);
            min-height: 100vh;
           
            line-height: 1.5;
            padding-top: env(safe-area-inset-top);
            padding-bottom: calc(72px + env(safe-area-inset-bottom));
        }

        main {
            max-width: 650px;
            margin: 0 auto;
            border: 1px solid #080943;
            height: 100vh;
            box-shadow: #080943 -1px 0px 5px 0px;
            background: linear-gradient(to bottom, #08094378 70%, transparent);
          
            position: relative;
        }

        /* Offline badge */
        .offline-badge {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: var(--accent-orange);
            color: var(--bg);
            text-align: center;
            padding: 6px;
            font-size: 0.75rem;
            font-weight: 900;
            z-index: 1000;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* App shell */
        .app-header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: linear-gradient(to bottom, var(--bg) 70%, transparent);
            padding: 20px 20px 12px;
            text-align: center;

        }

        .app-header img {
            max-width: 200px;
            height: auto;
            margin-bottom: 8px;
        }

        .app-header h1 {
            font-family: var(--font-head);
            font-size: 1.1rem;
            color: var(--accent-pink);
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Search bar */
        .search-bar {
            padding: 0 16px 12px;
            max-width: 720px;
            margin: 0 auto;
        }

        .search-bar input {
            width: 100%;
            padding: 12px 16px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: var(--text);
            font-family: var(--font-body);
            font-size: 0.95rem;
            outline: none;
            backdrop-filter: blur(8px);
        }

        .search-bar input::placeholder {
            color: var(--text-muted);
        }

        .search-bar input:focus {
            border-color: var(--accent-pink);
        }

        /* Last updated */
        .last-updated {
            text-align: center;
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 4px;
            letter-spacing: 0.5px;
        }

        /* Content */
        .content {
            padding: 0 16px 24px;
            max-width: 720px;
            margin: 0 auto;
        }

        .loading,
        .empty {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        /* Hero */
        .hero {
            text-align: center;
            padding: 20px 0 32px;
          
        }

        .hero-logo {
            width: 120px;
            height: 120px;
            margin: 0 auto 16px;
            background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5rem;
            box-shadow: 0 8px 32px rgba(176, 50, 122, 0.3);
            display: none;
        }

        .hero h2 {
            font-family: var(--font-head);
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 4px;
            color: var(--text);
        }

        .hero-sub {
            color: var(--accent-pink);
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        .countdown {
            font-family: var(--font-head);
            font-size: 2.4rem;
            font-weight: 700;
            color: var(--accent-orange);
            margin: 16px 0;
            text-shadow: 0 0 20px rgba(255, 111, 33, 0.3);
        }

        .countdown-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Info section */
        .info-section {
            margin-top: 8px;
        }

        .info-section h3 {
            font-family: var(--font-head);
            color: var(--accent-pink);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 16px;
            font-weight: 700;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .info-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px 16px;
            text-align: center;
            backdrop-filter: blur(8px);
            transition: all 0.2s;
        }

        .info-card:active {
            background: var(--bg-card-hover);
            border-color: var(--accent-pink);
        }

        .info-card .icon {
            font-size: 2rem;
            margin-bottom: 10px;
            display: block;
        }

        .info-card .label {
            font-weight: 700;
            font-size: 0.9rem;
            color: var(--text);
            margin-bottom: 4px;
        }

        .info-card .desc {
            font-size: 0.8rem;
            color: var(--text-muted);
            line-height: 1.4;
        }

        /* Quick nav buttons */
        .quick-nav {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: 24px 0;
            flex-wrap: wrap;
        }

        .quick-btn {
            background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple));
            border: none;
            border-radius: 50px;
            padding: 14px 24px;
            color: var(--text);
            font-family: var(--font-body);
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 16px rgba(176, 50, 122, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .quick-btn:active {
            transform: scale(0.96);
            box-shadow: 0 2px 8px rgba(176, 50, 122, 0.2);
        }

        .quick-btn-accent {
            background: linear-gradient(135deg, var(--accent-orange), var(--accent-pink));
        }

        /* Page intro */
        .page-intro {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 20px;
            backdrop-filter: blur(8px);
            font-size: 0.95rem;
            line-height: 1.7;
            color: var(--text-muted);
        }

        .page-intro p+p {
            margin-top: 12px;
        }

        /* FAQ */
        .faq-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .faq-item {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            cursor: pointer;
            transition: all 0.2s;
            backdrop-filter: blur(8px);
        }

        .faq-item:hover,
        .faq-item.open {
            border-color: var(--accent-pink);
            background: var(--bg-card-hover);
        }

        .faq-question {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 16px;
            font-family: var(--font-head);
            font-weight: 700;
            font-size: 0.9rem;
            gap: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            line-height: 1.4;
        }

        .faq-question span:first-child {
            flex: 1;
        }

        .faq-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .faq-toggle {
            font-size: 1.6rem;
            color: var(--accent-pink);
            font-weight: 400;
            min-width: 28px;
            text-align: center;
            line-height: 1;
            margin-top: -4px;
        }

        .faq-answer {
            padding: 0 16px 18px;
            color: var(--text-muted);
            font-size: 0.9rem;
            line-height: 1.6;
            display: none;
        }

        .faq-answer.empty {
            font-style: italic;
            opacity: 0.6;
        }

        .faq-item.open .faq-answer {
            display: block;
        }

        /* Grid */
        .grid-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .grid-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 18px 16px;
            transition: all 0.2s;
            backdrop-filter: blur(8px);
        }

        .grid-card:hover,
        .grid-card:active {
            border-color: var(--accent-pink);
            background: var(--bg-card-hover);
        }

        .grid-card h3 {
            font-family: var(--font-head);
            font-size: 1.05rem;
            color: var(--text);
            margin-bottom: 6px;
            font-weight: 700;
        }

        .grid-card p {
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.5;
        }

        /* Card header with favorite button */
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
        }

        .card-header h3 {
            flex: 1;
            margin-bottom: 0;
        }

        /* Favorite button */
        .fav-btn {
            background: none;
            border: none;
            font-size: 1.3rem;
            cursor: pointer;
            padding: 2px 4px;
            opacity: 0.3;
            transition: opacity 0.2s, transform 0.2s;
            line-height: 1;
            flex-shrink: 0;
        }

        .fav-btn:hover {
            opacity: 0.6;
        }

        .fav-btn.active {
            opacity: 1;
            filter: drop-shadow(0 0 6px rgba(255, 193, 7, 0.5));
        }

        .fav-btn:active {
            transform: scale(0.9);
        }

        /* Favorite group */
        .fav-group {
            margin-bottom: 16px;
        }

        .fav-group-title {
            font-family: var(--font-head);
            font-size: 0.8rem;
            color: var(--accent-pink);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 700;
            margin: 0 0 10px 4px;
        }

        /* Search results */
        .search-card {
            cursor: pointer;
        }

        .search-card:hover {
            border-color: var(--accent-purple);
        }

        .search-meta {
            font-size: 0.7rem;
            color: var(--accent-pink);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        /* Highlight animation */
        .highlight {
            animation: highlightPulse 2s ease-out;
        }

        @keyframes highlightPulse {
            0% {
                box-shadow: 0 0 0 4px rgba(176, 50, 122, 0.6);
            }

            100% {
                box-shadow: 0 0 0 0 transparent;
            }
        }

        /* Nav badge */
        .nav-badge {
            position: absolute;
            top: -4px;
            right: -4px;
            background: var(--accent-orange);
            color: var(--bg);
            font-size: 0.6rem;
            font-weight: 900;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }

        .bottom-nav button {
            position: relative;
        }

        /* Bottom nav */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 200;
            background: linear-gradient(to top, var(--bg) 80%, transparent);
            padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
            display: flex;
            justify-content: center;
            border-top: 1px solid var(--border);
            backdrop-filter: blur(20px);
            max-width: 650px;
            margin: auto;
        }

        .bottom-nav button {
            background: none;
            border: none;
            color: var(--text-muted);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            padding: 6px 8px;
            font-family: var(--font-body);
            font-size: 0.6rem;
            cursor: pointer;
            transition: color 0.2s;
            min-width: 56px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            font-weight: 700;
        }

        .bottom-nav button .nav-icon {
            font-size: 1.5rem;
        }

        .bottom-nav button.active {
            color: var(--accent-pink);
        }

        .bottom-nav button.active .nav-icon {
            filter: drop-shadow(0 0 8px rgba(176, 50, 122, 0.5));
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--accent-pink);
            border-radius: 4px;
        }

        /* Install prompt */
        .install-prompt {
            position: fixed;
            bottom: calc(96px + env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%);
            z-index: 300;
            background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple));
            border-radius: 50px;
            padding: 10px 18px 10px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 24px rgba(176, 50, 122, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.15);
            cursor: pointer;
            font-family: var(--font-body);
            font-weight: 700;
            font-size: 0.85rem;
            color: var(--text);
            transition: transform 0.2s, opacity 0.3s, bottom 0.3s;
            max-width: 90vw;
            white-space: nowrap;
            backdrop-filter: blur(10px);
        }

        .install-prompt:active {
            transform: translateX(-50%) scale(0.96);
        }

        .install-prompt.hidden {
            opacity: 0;
            pointer-events: none;
            transform: translateX(-50%) translateY(20px);
        }

        .install-prompt .install-icon {
            font-size: 1.1rem;
        }

        .install-prompt .install-text {
            letter-spacing: 0.5px;
        }

        .install-prompt .close-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            border-radius: 50%;
            width: 26px;
            height: 26px;
            color: var(--text);
            font-size: 0.7rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: 4px;
            flex-shrink: 0;
            transition: background 0.2s;
        }

        .install-prompt .close-btn:active {
            background: rgba(255, 255, 255, 0.35);
        }
    </style>
</head>

<body>
    <main>
        <div class="app-header">
            <!--<img src="images/datum.png" alt="Bucht der Träumer" onerror="this.style.display='none'">-->
            <h1 id="pageTitle">Bucht der Träumer*</h1>
            <div class="last-updated" id="lastUpdated"></div>
        </div>

        <div class="search-bar" id="searchBar" style="display:none;">
            <input type="search" id="searchInput" placeholder="🔍 Suchen..." autocomplete="off">
        </div>
        <div id="searchResults" style="padding:0 16px;max-width:720px;margin:0 auto;"></div>

        <div class="content" id="content">
            <div class="loading">Laden...⏳</div>
        </div>

        
        <div class="install-prompt hidden" id="installBtn">
            <span class="install-icon">📲</span>
            <span class="install-text" id="installText">Zum Startbildschirm</span>
            <button class="close-btn" id="installClose">✕</button>
        </div>

        <nav class="bottom-nav" id="pageNav"><!-- JS fills --></nav>
    </main>
    <script src="js/app-v3.js"></script>
</body>

</html>
