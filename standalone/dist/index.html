<!doctype html>
<html lang="de">

<head>
  <meta charset="UTF-8" />
   <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no, maximum-scale=1.0, user-scalable=0"
    />
  <meta name="theme-color" content="#080943" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Bucht der Träumer – Festival Guide</title>
  <link rel="manifest" href="manifest.json?v=1.3.1" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link
    href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=Space+Grotesk:wght@500;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="css/tokens.css?v=1.3.1" />
  <link rel="stylesheet" href="css/base.css?v=1.3.1" />
  <link rel="stylesheet" href="css/components.css?v=1.3.1" />
  <link rel="stylesheet" href="css/views.css?v=1.3.1" />
</head>

<body>

  <main>
  <div class="search-bar" id="searchBar">
    <button type="button" class="search-toggle" id="searchToggle" data-action="toggle-search-bar" aria-label="Search">
      <img src="images/search.svg" alt="" width="20" height="20">
    </button>
    <div class="search-input-wrap" id="searchInputWrap">
      <span class="search-input-icon"><img src="images/search.svg" alt="" width="18" height="18"></span>
      <input type="search" id="searchInput" placeholder="Suchen..." autocomplete="off">
      <button type="button" class="search-input-close" data-action="close-search-bar" aria-label="Close search">
        <img src="images/close.svg" alt="" width="14" height="14">
      </button>
    </div>
  </div>

  <div class="search-modal" id="searchModal">
    <div class="search-modal-backdrop" data-action="close-search"></div>
    <div class="search-modal-panel">
      <div class="search-modal-header">
        <span>Suchergebnisse</span>
        <button type="button" class="search-modal-close" data-action="close-search">✕</button>
      </div>
      <div class="search-results" id="searchResults"></div>
    </div>
  </div>

    <div class="app-header" id="app-header">
      <h1 id="pageTitle">Bucht der Träumer</h1>
      <div class="lang-toggle" id="langToggle">
        <button data-action="set-lang" data-lang="de">DE</button>
        <button data-action="set-lang" data-lang="en">EN</button>
      </div>
      <div class="last-updated" id="lastUpdated"></div>
    </div>

    <div class="install-card" id="installCard">
      <button type="button" class="install-card-close" id="installCardClose" aria-label="Close">✕</button>
      <h3 id="installCardTitle"></h3>
      <p id="installCardText"></p>
    </div>

    <div class="content" id="content">
      <div class="loading">Laden...⏳</div>
    </div>

    <nav class="bottom-nav" id="pageNav"><!-- JS fills --></nav>
    <figure>
      <video height="1020" style="aspect-ratio: 1920 / 1020" width="1920" autoplay="" loop="" muted=""
        poster="https://bucht-der-traeumer.de/wp-content/uploads/2026/01/landing_1920.jpg"
        src="https://videos.files.wordpress.com/pAo4SShl/bdt_animation_story_compressed_720p.mp4"
        playsinline=""></video>
    </figure>
  </main>

  <script type="module" src="js/app.js?v=1.3.1"></script>
</body>

</html>
